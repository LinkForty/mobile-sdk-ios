name: Test

on:
  push:
    branches: [ main, develop ]
  pull_request:
    branches: [ main, develop ]

jobs:
  test:
    name: Test on iOS ${{ matrix.ios }}
    runs-on: macos-15
    strategy:
      fail-fast: false
      matrix:
        ios: ['18.0', '17.0', '16.0']
        include:
          - ios: '18.0'
            device: 'iPhone 16'
          - ios: '17.0'
            device: 'iPhone 15'
          - ios: '16.0'
            device: 'iPhone 14'

    steps:
    - name: Checkout
      uses: actions/checkout@v4

    - name: Select Xcode
      run: sudo xcode-select -s /Applications/Xcode_16.0.app

    - name: Show Xcode version
      run: xcodebuild -version

    - name: Run tests
      run: |
        set -o pipefail
        xcodebuild test \
          -scheme LinkFortySDK \
          -destination "platform=iOS Simulator,name=${{ matrix.device }},OS=${{ matrix.ios }}" \
          -enableCodeCoverage YES \
          | xcpretty

    - name: Upload coverage to Codecov
      if: matrix.ios == '18.0'
      uses: codecov/codecov-action@v3
      with:
        file: ./build/CodeCoverage/LinkFortySDK.xcresult
        flags: unittests
        fail_ci_if_error: false

  locale:
    # The whole suite under device languages and regions whose locale identifiers
    # carry scripts, right-to-left text or non-Gregorian defaults. The newest iOS
    # only; the version runs above cover the OS range.
    name: Test on iOS 18.0 (${{ matrix.language }}_${{ matrix.region }})
    runs-on: macos-15
    strategy:
      fail-fast: false
      matrix:
        include:
          - { language: en, region: ES }
          - { language: ar, region: SA }
          - { language: ja, region: JP }
          - { language: zh-Hans, region: CN }
          - { language: he, region: IL }
          - { language: th, region: TH }

    steps:
    - name: Checkout
      uses: actions/checkout@v4

    - name: Select Xcode
      run: sudo xcode-select -s /Applications/Xcode_16.0.app

    - name: Run tests
      run: |
        set -o pipefail
        xcodebuild test \
          -scheme LinkFortySDK \
          -destination "platform=iOS Simulator,name=iPhone 16,OS=18.0" \
          -testLanguage ${{ matrix.language }} \
          -testRegion ${{ matrix.region }} \
          | tee xcodebuild.log \
          | xcpretty
        grep -h "Locale.current" xcodebuild.log || true

  lint:
    name: SwiftLint
    runs-on: macos-15
    steps:
    - name: Checkout
      uses: actions/checkout@v4

    - name: Install SwiftLint
      run: brew install swiftlint

    - name: Run SwiftLint
      run: swiftlint lint --strict

  spm:
    name: SPM Build
    runs-on: macos-15
    steps:
    - name: Checkout
      uses: actions/checkout@v4

    - name: Build with SPM
      run: swift build -v
