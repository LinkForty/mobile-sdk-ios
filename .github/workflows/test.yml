name: Test

on:
  push:
    branches: [ main, develop ]
  pull_request:
    branches: [ main, develop ]

jobs:
  test:
    # Runtimes the runner image ships (iOS 18.6, 26.2) run as is; iOS 17 and the
    # iOS 16 deployment target are downloaded by the job.
    name: Test on iOS ${{ matrix.ios }}
    runs-on: macos-15
    strategy:
      fail-fast: false
      matrix:
        include:
          - { ios: '26.2', xcode: '26.2', device: 'iPhone 17' }
          - { ios: '18.6', xcode: '16.4', device: 'iPhone 16' }
          - { ios: '17.5', xcode: '16.4', device: 'iPhone 15', download: true }
          - { ios: '16.4', xcode: '16.4', device: 'iPhone 14', download: true }

    steps:
    - name: Checkout
      uses: actions/checkout@v4

    - name: Select Xcode
      run: sudo xcode-select -s /Applications/Xcode_${{ matrix.xcode }}.app

    - name: Prepare simulator
      id: sim
      run: bash .github/scripts/prepare-simulator.sh "${{ matrix.ios }}" "${{ matrix.device }}" "${{ matrix.download }}"

    - name: Run tests
      run: |
        set -o pipefail
        xcodebuild test \
          -scheme LinkFortySDK \
          -destination "id=${{ steps.sim.outputs.udid }}" \
          -enableCodeCoverage YES \
          | xcpretty

  locale:
    # The whole suite under device languages and regions whose locale identifiers
    # carry scripts, right-to-left text or non-Gregorian defaults, on the newest iOS.
    name: Test on iOS 26.2 (${{ matrix.language }}_${{ matrix.region }})
    runs-on: macos-15
    strategy:
      fail-fast: false
      matrix:
        include:
          - { language: en, region: ES }
          - { language: ar, region: SA }
          - { language: ja, region: JP }
          - { language: zh-Hans, region: CN }
          - { language: he, region: IL }
          - { language: th, region: TH }

    steps:
    - name: Checkout
      uses: actions/checkout@v4

    - name: Select Xcode
      run: sudo xcode-select -s /Applications/Xcode_26.2.app

    - name: Prepare simulator
      id: sim
      run: bash .github/scripts/prepare-simulator.sh "26.2" "iPhone 17" ""

    - name: Run tests
      run: |
        set -o pipefail
        xcodebuild test \
          -scheme LinkFortySDK \
          -destination "id=${{ steps.sim.outputs.udid }}" \
          -testLanguage ${{ matrix.language }} \
          -testRegion ${{ matrix.region }} \
          | xcpretty

  lint:
    name: SwiftLint
    runs-on: macos-15
    steps:
    - name: Checkout
      uses: actions/checkout@v4

    - name: Install SwiftLint
      run: brew install swiftlint

    - name: Run SwiftLint
      run: swiftlint lint --strict

  spm:
    name: SPM Build
    runs-on: macos-15
    steps:
    - name: Checkout
      uses: actions/checkout@v4

    - name: Build with SPM
      run: swift build -v
