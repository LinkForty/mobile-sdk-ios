name: Release

# Publishes a GitHub Release when a version tag is pushed.
#
# Swift Package Manager has no registry to publish to: a tag IS the release, and
# the GitHub Release is what tells anyone watching the repo — and anyone reading
# the README badge or Xcode's package update prompt — that a new version exists.
# Cutting one by hand means a forgotten step leaves users on an old version with
# no signal that a newer one shipped.
on:
  push:
    tags: ['v*']

permissions:
  contents: write

jobs:
  verify:
    name: Verify Release
    runs-on: macos-15
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      # SDKInfo.version is hand-maintained (SPM exposes no runtime version for
      # the package) and is what every request reports as `sdkVersion`. If it
      # drifts from the tag, version diagnostics silently describe the wrong
      # release — so a mismatch fails the release rather than shipping it.
      - name: Verify SDKInfo.version matches the tag
        run: |
          TAG="${GITHUB_REF_NAME#v}"
          SDK_VERSION=$(grep -oE 'static let version = "[^"]+"' Sources/LinkFortySDK/SDKInfo.swift | sed -E 's/.*"([^"]+)".*/\1/')
          if [ -z "$SDK_VERSION" ]; then
            echo "::error::Could not read SDKInfo.version from Sources/LinkFortySDK/SDKInfo.swift"
            exit 1
          fi
          if [ "$TAG" != "$SDK_VERSION" ]; then
            echo "::error::Tag ${GITHUB_REF_NAME} does not match SDKInfo.version (${SDK_VERSION}). Bump SDKInfo.swift, or retag."
            exit 1
          fi
          echo "SDKInfo.version ${SDK_VERSION} matches tag ${GITHUB_REF_NAME}"

      - name: Verify CHANGELOG has an entry for this version
        run: |
          TAG="${GITHUB_REF_NAME#v}"
          if ! grep -q "^## \[${TAG}\]" CHANGELOG.md; then
            echo "::error::CHANGELOG.md has no '## [${TAG}]' heading. Move the Unreleased section to ${TAG} before tagging."
            exit 1
          fi

      - name: Build
        run: swift build -v

      - name: Run tests
        run: swift test

  publish:
    name: Publish GitHub Release
    needs: verify
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      # The release notes are the CHANGELOG section for this version — the notes
      # are written once, in the file, and never retyped into the release form.
      - name: Extract release notes
        run: |
          TAG="${GITHUB_REF_NAME#v}"
          awk -v v="$TAG" '$0 ~ "^## \\["v"\\]" {found=1; next} found && /^## \[/ {exit} found' CHANGELOG.md > RELEASE_NOTES.md
          if [ ! -s RELEASE_NOTES.md ]; then
            echo "::error::Extracted release notes for ${TAG} are empty"
            exit 1
          fi
          cat RELEASE_NOTES.md

      - name: Create GitHub Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release create "${GITHUB_REF_NAME}" \
            --title "${GITHUB_REF_NAME}" \
            --notes-file RELEASE_NOTES.md \
            --verify-tag
